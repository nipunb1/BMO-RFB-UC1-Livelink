server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: bmo-rfb-backend
  datasource:
    url: jdbc:h2:mem:rfbdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bmo.rfb: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

borrower-uen-service:
  url: http://localhost:8001/api
